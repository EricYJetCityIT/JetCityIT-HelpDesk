name: Help Desk scheduled background jobs

# Azure Static Web Apps' managed Functions integration only supports HTTP
# triggers (confirmed against Microsoft's own docs) -- Timer Triggers are
# silently never invoked in this hosting model. Rather than standing up a
# separate "bring your own Functions" Azure resource just to get a working
# scheduler, these four background jobs (email-in replies, SLA breach
# escalation, recurring ticket creation, auto-closing resolved tickets) run
# as ordinary HTTP endpoints instead, and this workflow calls each of them
# on a schedule using GitHub's own cron runner. Every job is naturally
# idempotent/safe to call more often than strictly needed (see each
# function's own comments), so one shared 5-minute schedule for all four is
# simpler than juggling separate schedules -- the daily recurring-ticket
# job just no-ops on every tick where nothing is actually due yet.
#
# Requires a repo secret INTERNAL_CRON_SECRET, matching the app setting of
# the same name on the jetcityit-helpdesk Static Web App -- this is what
# stops a stranger from directly POSTing these endpoints and triggering
# them outside the schedule.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

# One run at a time. A tick that outlasts the 5-minute schedule (a backlog of
# emails with pictures) must not overlap the next one: both could pick up the
# same email before either has written its dedup marker, and post the reply
# twice. A run that has to wait is kept, not cancelled.
concurrency:
  group: helpdesk-scheduled-ticks
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Email ingest tick
        continue-on-error: true
        run: |
          curl -sf -X POST "https://helpdesk.jetcityit.com/api/internal/email-ingest-tick" \
            -H "X-Cron-Secret: ${{ secrets.INTERNAL_CRON_SECRET }}"

      - name: SLA escalation tick
        continue-on-error: true
        run: |
          curl -sf -X POST "https://helpdesk.jetcityit.com/api/internal/sla-escalation-tick" \
            -H "X-Cron-Secret: ${{ secrets.INTERNAL_CRON_SECRET }}"

      - name: Recurring tickets tick
        continue-on-error: true
        run: |
          curl -sf -X POST "https://helpdesk.jetcityit.com/api/internal/recurring-tickets-tick" \
            -H "X-Cron-Secret: ${{ secrets.INTERNAL_CRON_SECRET }}"

      - name: Auto-close resolved tickets tick
        continue-on-error: true
        run: |
          curl -sf -X POST "https://helpdesk.jetcityit.com/api/internal/auto-close-tick" \
            -H "X-Cron-Secret: ${{ secrets.INTERNAL_CRON_SECRET }}"
